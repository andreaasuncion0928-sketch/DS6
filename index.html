<section id="page-0" class="relative w-full h-screen overflow-hidden bg-plum-deep flex flex-col justify-between">
  <!-- Background Image with Calibrated Luxury Scrim -->
  <div class="absolute inset-0 z-0">
    <!-- Your original background -->
    <div class="w-full h-full bg-custom-1 bg-cover bg-center"></div>
    
    <!-- Multi-layered Luxury Scrim: Darkens center-stage while preserving flower edges -->
    <div class="absolute inset-0 bg-gradient-to-b from-[#0b0412]/75 via-[#0b0412]/45 to-[#0b0412]/85 backdrop-blur-[1px]"></div>
    <div class="absolute inset-0 bg-radial-gradient from-transparent via-[#0b0412]/40 to-[#0b0412]/80"></div>
  </div>

  <!-- Top Spacing placeholder for navbar -->
  <div class="w-full h-20 relative z-10"></div>

  <!-- Central Invitation Card (Restrained & Elegant) -->
  <div class="relative z-10 max-w-2xl mx-auto px-6 text-center my-auto">
    <!-- Optional: Frosted Glass Panel to cleanly lift text off background noise -->
    <div class="py-10 px-8 sm:px-14 rounded-2xl bg-[#0f0617]/35 backdrop-blur-md border border-white/10 shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
      
      <!-- Sub-label -->
      <p class="font-cinzel text-[11px] sm:text-xs tracking-[0.45em] text-[#d4bbf3]/90 uppercase font-light mb-3">
        The Honour of Your Presence
      </p>

      <!-- Main Name: Smaller, refined serif spacing -->
      <h1 class="font-serif text-3xl sm:text-5xl md:text-6xl tracking-[0.28em] text-[#fcfbfa] font-light uppercase leading-tight">
        Franz
      </h1>

      <!-- Milestone Script: Delicate, not dominating -->
      <div class="font-script text-4xl sm:text-6xl md:text-7xl text-[#f3e5ab] leading-none my-1 select-none font-normal">
        Eighteenth
      </div>

      <!-- Subtle Accent Separator -->
      <div class="flex items-center justify-center space-x-3 my-5">
        <span class="h-[0.5px] w-12 bg-gradient-to-r from-transparent to-[#d4af37]/60"></span>
        <span class="text-[9px] tracking-widest text-[#d4af37] font-serif uppercase">✦</span>
        <span class="h-[0.5px] w-12 bg-gradient-to-l from-transparent to-[#d4af37]/60"></span>
      </div>

      <p class="font-cinzel text-[10px] sm:text-[11px] tracking-[0.35em] text-[#d4bbf3]/80 uppercase font-light mb-7">
        A New Chapter Begins
      </p>

      <!-- CTA Button: Clean, Fine-bordered, High-end -->
      <div>
        <button onclick="enterCelebration()" 
                class="inline-block px-8 py-3 rounded-full border border-[#d4af37]/60 bg-[#0f0617]/40 hover:bg-[#d4af37]/15 text-[#fcfbfa] hover:text-[#f3e5ab] font-cinzel text-[11px] tracking-[0.3em] uppercase transition-all duration-300 shadow-[0_0_20px_rgba(212,175,55,0.15)] hover:border-[#f3e5ab]">
          Enter Invitation
        </button>
      </div>
    </div>
  </div>

  <!-- Bottom Floating Countdown (Minimal Horizontal Pill replacing the heavy right box) -->
  <div class="relative z-10 pb-6 flex flex-col items-center justify-center gap-3">
    <div class="inline-flex items-center gap-6 sm:gap-8 px-6 py-2.5 rounded-full bg-[#0b0412]/60 backdrop-blur-md border border-white/10 shadow-lg text-center font-cinzel">
      <div>
        <span id="p1-days" class="text-sm sm:text-base font-light text-[#fcfbfa] block leading-none">697</span>
        <span class="text-[8px] tracking-[0.2em] text-[#d4bbf3]/70 uppercase">Days</span>
      </div>
      <span class="text-white/20 text-xs">/</span>
      <div>
        <span id="p1-hours" class="text-sm sm:text-base font-light text-[#fcfbfa] block leading-none">01</span>
        <span class="text-[8px] tracking-[0.2em] text-[#d4bbf3]/70 uppercase">Hours</span>
      </div>
      <span class="text-white/20 text-xs">/</span>
      <div>
        <span id="p1-minutes" class="text-sm sm:text-base font-light text-[#fcfbfa] block leading-none">27</span>
        <span class="text-[8px] tracking-[0.2em] text-[#d4bbf3]/70 uppercase">Mins</span>
      </div>
      <span class="text-white/20 text-xs">/</span>
      <div>
        <span id="p1-seconds" class="text-sm sm:text-base font-light text-[#fcfbfa] block leading-none">21</span>
        <span class="text-[8px] tracking-[0.2em] text-[#d4bbf3]/70 uppercase">Secs</span>
      </div>
    </div>

    <!-- Minimal Audio Toggle -->
    <button onclick="toggleAudio()" class="text-[9px] font-cinzel tracking-[0.25em] text-[#d4af37]/80 hover:text-white uppercase transition flex items-center gap-1.5">
      <span id="heroMusicStatus">Sound On</span>
      <i id="heroMusicIcon" class="fa-solid fa-volume-high text-[8px]"></i>
    </button>
  </div>
</section>
